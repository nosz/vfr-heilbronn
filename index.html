  const c = h("section", {class:"sharecard", "aria-labelledby":"sht"}, h("div", {class:"sh"}, h("span", {class:"si", "aria-hidden":"true"}, "🔗"), h("div", null, h("b", {id:"sht", text:t("shT")}), h("small", {text:t("shS")}))));
  const row = h("div", {class:"sharerow"});
  row.append(h("a", {class:"btn", href:"https://wa.me/?text=" + enc(txt + " " + SHARE_URL), target:"_blank", rel:"noopener noreferrer"}, "💬 " + t("shWa")));
  row.append(h("a", {class:"btn ghost", href:"mailto:?subject=" + enc(t("shSubj")) + "&body=" + enc(txt + "\r\n\r\n" + SHARE_URL)}, "✉️ " + t("shMail")));
  row.append(h("button", {type:"button", class:"btn ghost", onclick:async () => {
    let ok = false;
    try{ await navigator.clipboard.writeText(SHARE_URL); ok = true; }catch(x){
      try{ const ta = h("textarea", {readonly:"", style:"position:fixed;left:-9999px"}); ta.value = SHARE_URL; document.body.append(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); }catch(y){}
    }
    snack(ok ? t("shCopied") : t("shFail") + " " + SHARE_URL, null, null, ok ? 2500 : 6000);
  }}, "📋 " + t("shCopy")));
  c.append(row); return c;
}
function snack(text, btn, fn, ms){
  const old = document.querySelector(".snack"); if(old) old.remove();
  const s = h("div", {class:"snack", role:"status"}, h("span", {text}));
  if(btn) s.append(h("button", {type:"button", onclick:() => { fn(); s.remove(); }}, btn));
  document.body.append(s); if(ms) setTimeout(() => s.remove(), ms);
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if(view.v === "home" && !editName) render(true); });
window.addEventListener("appinstalled", () => { deferredInstall = null; installState = "done"; if(view.v === "home") render(true); });
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  let reloading = false, hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(!hadController){ hadController = true; return; } if(reloading) return; reloading = true; location.reload(); });
  window.addEventListener("load", () => {
    const first = !navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(reg => {
      const upd = w => snack(t("updT"), t("updB"), () => w.postMessage("SKIP_WAITING"));
      if(reg.waiting && navigator.serviceWorker.controller) upd(reg.waiting);
      reg.addEventListener("updatefound", () => { const w = reg.installing; if(w) w.addEventListener("statechange", () => { if(w.state === "installed"){ if(navigator.serviceWorker.controller) upd(w); else snack(t("offT"), null, null, 4500); } }); });
    }).catch(() => {});
  });
}

/* Feste Orientierungsleiste: Hoehen messen, Schatten nur wenn festgeheftet */
function syncHH(){
  const r = document.documentElement.style, e = document.querySelector(".top"), n = document.querySelector(".stickynav");
  if(e) r.setProperty("--hh", e.getBoundingClientRect().height + "px");
  r.setProperty("--nh", n ? n.getBoundingClientRect().height + "px" : "0px");
  stuckPruefen();
}
function stuckPruefen(){
  const n = document.querySelector(".stickynav"); if(!n) return;
  const top = parseFloat(getComputedStyle(n).top) || 0;
  n.classList.toggle("stuck", scrollY > 2 && n.getBoundingClientRect().top <= top + 1);
}
addEventListener("resize", syncHH);
let stuckBusy = false;
addEventListener("scroll", () => { if(stuckBusy) return; stuckBusy = true; requestAnimationFrame(() => { stuckBusy = false; stuckPruefen(); }); }, {passive:true});
{ const _render = render; render = function(...a){ const r = _render.apply(this, a); syncHH(); return r; }; }
syncHH();
